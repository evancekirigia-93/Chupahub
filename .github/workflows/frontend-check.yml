name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Confirm legacy map is not tracked
        run: |
          if git ls-files --error-unmatch src/components/OpenStreetMap.tsx >/dev/null 2>&1; then
            echo "::error file=src/components/OpenStreetMap.tsx::Delete the legacy Leaflet map component from this branch."
            exit 1
          fi
      - run: npm run check:no-legacy-map
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:production-assets
